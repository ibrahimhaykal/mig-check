[package]
name = "mig-check"
version = "0.1.0"
edition = "2024"
default-run = "mig-check"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sqlx = { version = "0.9.0", features = ["runtime-tokio", "postgres"] }
tokio = { version = "1.54.1", features = ["full"] }
